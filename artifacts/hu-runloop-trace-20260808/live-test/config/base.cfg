# Base RetroArch config for MHI2Q (ro, at /mnt/app/root/retroarch/retroarch.cfg).
# User overrides go to /fs/sda0/retroarch/config/retroarch.cfg (--appendconfig).

# --- paths: executable cores on the ro appimg; all external data on SD ---
libretro_directory = "/mnt/app/root/retroarch/cores"
libretro_info_path = "/fs/sda0/retroarch/info"
content_database_path = "/fs/sda0/retroarch/database/rdb"
assets_directory = "/fs/sda0/retroarch/assets"
video_shader_dir = "/fs/sda0/retroarch/shaders"
rgui_browser_directory = "/fs/sda0/retroarch/roms"
savefile_directory = "/fs/sda0/retroarch/saves"
savestate_directory = "/fs/sda0/retroarch/states"
system_directory = "/fs/sda0/retroarch/system"
cheat_database_path = "/fs/sda0/retroarch/cheats"
playlist_directory = "/fs/sda0/retroarch/playlists"
log_dir = "/fs/sda0/retroarch/logs"
screenshot_directory = "/fs/sda0/retroarch/screenshots"
rgui_config_directory = "/fs/sda0/retroarch/config"
joypad_autoconfig_dir = "/fs/sda0/retroarch/autoconfig"

# --- drivers (all native QNX, see src/*) ---
video_driver = "gl"
audio_driver = "qsa"
menu_driver = "ozone"
input_joypad_driver = "qnx"
input_autodetect_enable = "true"
video_fullscreen = "true"
video_fullscreen_x = "1024"
video_fullscreen_y = "480"
# Vendor EGL on the display-manager video layer can block forever waiting for
# a Screen vsync acknowledgement. The QNX context presents at interval 0; RA's
# non-vsync frame limiter keeps the menu/core paced at the configured refresh.
video_vsync = "false"
video_shader_enable = "false"
core_info_cache_enable = "true"
config_save_on_exit = "false"

# --- Ozone layout for the 1024x480 ultrawide HU display ---
ozone_show_sidebar = "true"
ozone_collapse_sidebar = "true"
ozone_menu_color_theme = "1"
ozone_font_scale = "1"
ozone_font_scale_factor_global = "1.0"
menu_scale_factor = "1.0"
menu_show_sublabels = "false"

# --- lifecycle: defensive save-state on pause is written natively; auto-load it
#     on next launch so an unclean power-off / timeout resumes exactly. ---
savestate_auto_load = "true"
savestate_auto_save = "false"
sort_savefiles_enable = "true"
sort_savestates_enable = "true"

# --- summon the Ozone menu mid-game from the gamepad (no HU keypad in-game).
#     Combo 2 = L3+R3 (press both analog sticks). ---
input_menu_toggle_gamepad_combo = "2"
menu_swap_ok_cancel_buttons = "false"

# --- logging: BRING-UP = verbose to a file on the SD (read via ssh). Flip
#     log_verbosity to "false" once video/audio are confirmed. ---
log_verbosity = "true"
log_to_file = "true"
log_to_file_timestamp = "true"
frontend_log_level = "0"
libretro_log_level = "0"
