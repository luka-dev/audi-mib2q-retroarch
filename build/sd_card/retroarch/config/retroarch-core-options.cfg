# Factory core-option defaults for the MHI2Q build. ra.sh copies this file to
# the current SD card once; subsequent changes remain local to that card.
# Keep this deliberately minimal: only select the fast, known-good QNX
# backends. All visual/compatibility tuning is left writable in RetroArch.

# Game Boy Advance: prefer a supplied official BIOS. The QNX build uses the
# stable ARM interpreter; the old working standalone gpSP did the same.
gpsp_bios = "auto"
gpsp_drc = "disabled"
gpsp_frameskip = "disabled"

# PlayStation: no frameskip. Keep the expensive DRC/GPU workers off the main
# loop. SPU stays on the main thread: DRC + GPU + CD read-ahead + QSA already
# occupy the four Krait cores, and a fifth worker caused scheduler contention.
pcsx_rearmed_bios = "auto"
pcsx_rearmed_drc = "enabled"
pcsx_rearmed_drc_thread = "enabled"
pcsx_rearmed_gpu_thread_rendering = "enabled"
pcsx_rearmed_spu_thread = "disabled"
# Buffer ~13.7 seconds of raw CD sectors on the SD-backed HU (about 2.4 MiB).
# This hides short SD stalls without the 750 MiB cost of whole-disc precache.
pcsx_rearmed_cd_readahead = "1024"
# Let the dynarec skip GTE result registers a block never reads. Overflow/
# saturation flags stay computed (nogteflags left off) so accuracy is preserved.
pcsx_rearmed_gteregsunneeded = "enabled"
pcsx_rearmed_nogteflags = "disabled"
pcsx_rearmed_frameskip_type = "disabled"
pcsx_rearmed_neon_enhancement_enable = "disabled"
pcsx_rearmed_neon_enhancement_tex_adj_v2 = "disabled"
pcsx_rearmed_noxadecoding = "disabled"
pcsx_rearmed_nocdaudio = "disabled"

# Nintendo 64: QNX GLES2 renderer, HLE RSP and ARM dynarec at display height.
mupen64plus-cpucore = "dynamic_recompiler"
mupen64plus-rdp-plugin = "gliden64"
mupen64plus-rsp-plugin = "hle"
mupen64plus-aspect = "4:3"
mupen64plus-43screensize = "640x480"
