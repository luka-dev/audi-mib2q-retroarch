# Factory core-option defaults for the MHI2Q build. ra.sh copies this file to
# the current SD card once; subsequent changes remain local to that card.
# Keep this deliberately minimal: only select the fast, known-good QNX
# backends. All visual/compatibility tuning is left writable in RetroArch.

# Game Boy Advance: prefer a supplied official BIOS. The QNX build uses the
# stable ARM interpreter; the old working standalone gpSP did the same.
gpsp_bios = "auto"
gpsp_drc = "disabled"
gpsp_frameskip = "disabled"

# PlayStation: keep only the settings verified by the clean HU run. Leave the
# DRC/GPU workers on the core's multicore-aware "auto" defaults. A modest CD
# read-ahead absorbs SD stalls without forcing an oversized cache.
pcsx_rearmed_bios = "auto"
pcsx_rearmed_drc = "enabled"
pcsx_rearmed_spu_thread = "enabled"
pcsx_rearmed_cd_readahead = "256"
pcsx_rearmed_frameskip_type = "disabled"
pcsx_rearmed_rgb32_output = "disabled"
# These legacy option keys are inverted internally: "enabled" preserves XA
# decoding and CD-DA playback; "disabled" silences them.
pcsx_rearmed_noxadecoding = "enabled"
pcsx_rearmed_nocdaudio = "enabled"

# Nintendo 64: QNX GLES2 renderer, HLE RSP and ARM dynarec at display height.
mupen64plus-cpucore = "dynamic_recompiler"
mupen64plus-rdp-plugin = "gliden64"
mupen64plus-rsp-plugin = "hle"
mupen64plus-aspect = "4:3"
mupen64plus-43screensize = "640x480"

# PlayStation Portable: fixed QNX GLES2 backend and native PSP resolution.
# Keep frameskip and expensive texture upscaling off; game-specific tuning can
# be saved to the writable SD card from RetroArch.
ppsspp_backend = "opengl"
ppsspp_cpu_core = "JIT"
ppsspp_internal_resolution = "480x272"
ppsspp_frameskip = "disabled"
ppsspp_auto_frameskip = "disabled"
ppsspp_gpu_hardware_transform = "enabled"
ppsspp_software_skinning = "enabled"
ppsspp_texture_scaling_level = "disabled"
