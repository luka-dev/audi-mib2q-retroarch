# RetroArch appliance content discovery rules.
#
# rootN values are the only media roots the scanner may visit. Each rule adds
# its relative directory below every root and merges the results into one .lpl.
root0 = "/fs/sda0/retroarch"
root1 = "/fs/sdb0/retroarch"

# Sony PlayStation / PCSX-ReARMed
rule0_directory = "ps1"
rule0_playlist = "Sony - PlayStation"
rule0_extensions = "cue|chd|pbp"
rule0_core = "pcsx_rearmed_libretro"
rule0_core_name = "PCSX-ReARMed"
rule0_recursive = "true"
# Clean region/revision tags while retaining multi-disc suffixes.
rule0_label_mode = "keep_disc"

# Nintendo Game Boy Advance / gpSP
rule1_directory = "gba"
rule1_playlist = "Nintendo - Game Boy Advance"
rule1_extensions = "gba|bin"
rule1_core = "gpsp_libretro"
rule1_core_name = "gpSP"
rule1_recursive = "true"
rule1_label_mode = "keep_disc"

# Nintendo 64 / Mupen64Plus-Next GLES2
rule2_directory = "n64"
rule2_playlist = "Nintendo - Nintendo 64"
rule2_extensions = "z64|n64|v64"
rule2_core = "mupen64plus_next_gles2_libretro"
rule2_core_name = "Mupen64Plus-Next"
rule2_recursive = "true"
rule2_label_mode = "keep_disc"
