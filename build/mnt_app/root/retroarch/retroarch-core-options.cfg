# Factory core-option defaults for the MHI2Q build. ra.sh copies this file to
# the current SD card once; subsequent changes remain local to that card.
# Keep this deliberately minimal: only select the fast, known-good QNX
# backends. All visual/compatibility tuning is left writable in RetroArch.

# Game Boy Advance: prefer a supplied official BIOS. The QNX build uses the
# stable ARM interpreter; the old working standalone gpSP did the same.
gpsp_bios = "auto"
gpsp_drc = "disabled"
gpsp_frameskip = "disabled"

# PlayStation: keep only the settings verified by the clean HU run. Leave the
# DRC/GPU workers on the core's multicore-aware "auto" defaults. A modest CD
# read-ahead absorbs SD stalls without forcing an oversized cache.
pcsx_rearmed_bios = "auto"
pcsx_rearmed_drc = "enabled"
pcsx_rearmed_spu_thread = "enabled"
pcsx_rearmed_cd_readahead = "256"
pcsx_rearmed_frameskip_type = "disabled"
pcsx_rearmed_rgb32_output = "disabled"
# These legacy option keys are inverted internally: "enabled" preserves XA
# decoding and CD-DA playback; "disabled" silences them.
pcsx_rearmed_noxadecoding = "enabled"
pcsx_rearmed_nocdaudio = "enabled"

# Nintendo 64: QNX GLES2 renderer, HLE RSP and ARM dynarec at display height.
mupen64plus-cpucore = "dynamic_recompiler"
mupen64plus-rdp-plugin = "gliden64"
mupen64plus-rsp-plugin = "hle"
mupen64plus-aspect = "4:3"
mupen64plus-43screensize = "640x480"

# PlayStation Portable: conservative APQ8064/QNX baseline. Native resolution
# keeps demanding games GPU-safe; 2x (960x544) is the first per-game upgrade to
# try on the 1024x480 panel. Never cache a full ISO in the HU's limited RAM.
ppsspp_backend = "opengl"
ppsspp_performance_stats = "log"
ppsspp_cpu_core = "JIT"
ppsspp_fast_memory = "enabled"
ppsspp_ignore_bad_memory_access = "enabled"
ppsspp_io_timing_method = "Fast"
ppsspp_force_lag_sync = "disabled"
ppsspp_locked_cpu_speed = "disabled"
ppsspp_cache_iso = "disabled"
ppsspp_cheats = "disabled"
ppsspp_psp_model = "psp_2000_3000"
ppsspp_memstick_inserted = "enabled"

# Renderer: GLES2 hardware path, native PSP resolution and no frame dropping.
# Duplicate-frame output keeps native 30 FPS games smooth on the 60 Hz HMI.
ppsspp_software_rendering = "disabled"
ppsspp_internal_resolution = "480x272"
ppsspp_cropto16x9 = "enabled"
ppsspp_frameskip = "disabled"
ppsspp_frameskiptype = "Number of frames"
ppsspp_auto_frameskip = "disabled"
ppsspp_frame_duplication = "enabled"
ppsspp_detect_vsync_swap_interval = "disabled"
ppsspp_inflight_frames = "Up to 2"
ppsspp_gpu_hardware_transform = "enabled"
ppsspp_software_skinning = "enabled"
ppsspp_hardware_tesselation = "disabled"

# Compatibility-first defaults: do not skip buffer effects/readbacks or use
# unsafe texture-cache hacks. Medium curves and 2x anisotropy are inexpensive
# compromises; CPU-heavy upscalers and replacement textures stay disabled.
ppsspp_skip_buffer_effects = "disabled"
ppsspp_disable_range_culling = "disabled"
ppsspp_skip_gpu_readbacks = "disabled"
ppsspp_lazy_texture_caching = "disabled"
ppsspp_spline_quality = "Medium"
ppsspp_lower_resolution_for_effects = "disabled"
ppsspp_texture_scaling_level = "disabled"
ppsspp_texture_deposterize = "disabled"
ppsspp_texture_shader = "disabled"
ppsspp_texture_anisotropic_filtering = "2x"
ppsspp_texture_filtering = "Auto"
ppsspp_smart_2d_texture_filtering = "disabled"
ppsspp_texture_replacement = "disabled"

# Match the Western PSP convention and keep unsupported HU networking off.
ppsspp_button_preference = "Cross"
