# Factory RetroArch config for MHI2Q (read-only template in appimg).
# ra.sh copies it to /fs/sda0/retroarch/config/retroarch.cfg on a fresh SD and
# runs the writable copy as the primary config. Replacing the SD therefore
# restores these known-good defaults without ever writing to /mnt/app.

# --- paths: immutable application/UI in appimg; user/runtime state on SD ---
libretro_directory = "/mnt/app/root/retroarch/cores"
libretro_info_path = "/fs/sda0/retroarch/info"
content_database_path = "/fs/sda0/retroarch/database/rdb"
assets_directory = "/mnt/app/root/retroarch/assets"
# OEM Audi MMI background (HMI image ID 27), pre-cropped to 1024x480.
menu_wallpaper = "/mnt/app/root/retroarch/assets/audi/wallpaper.png"
menu_wallpaper_opacity = "1.000"
# User shader packs are intentionally omitted from the Audi HU payload.
rgui_browser_directory = "/fs/sda0/retroarch/roms"
savefile_directory = "/fs/sda0/retroarch/saves"
savestate_directory = "/fs/sda0/retroarch/states"
system_directory = "/fs/sda0/retroarch/system"
cheat_database_path = "/fs/sda0/retroarch/cheats"
playlist_directory = "/fs/sda0/retroarch/playlists"
thumbnails_directory = "/fs/sda0/retroarch/thumbnails"
log_dir = "/fs/sda0/retroarch/logs"
screenshot_directory = "/fs/sda0/retroarch/screenshots"
rgui_config_directory = "/fs/sda0/retroarch/config"
core_options_path = "/fs/sda0/retroarch/config/retroarch-core-options.cfg"
joypad_autoconfig_dir = "/mnt/app/root/retroarch/autoconfig"

# --- drivers (all native QNX, see src/*) ---
video_driver = "gl"
audio_driver = "qsa"
# One mpl1 hardware fragment is 16 ms on MU1316 (768 frames at 48 kHz).
# Eight fragments match the proven stable gpSP/QSA ring depth.
audio_latency = "128"
audio_rate_control_delta = "0.020000"
audio_fastpath_s16 = "true"
audio_resampler = "cc"
audio_sync = "true"
menu_driver = "ozone"
# QNX widgets use fail-open queue locking: optional notifications may defer a
# frame under contention but must never block the input/render loop.
menu_enable_widgets = "true"
fps_show = "false"
statistics_show = "false"
video_refresh_rate = "60.000000"
threaded_data_runloop_enable = "true"
menu_show_load_content_animation = "true"
notification_show_autoconfig = "true"
notification_show_autoconfig_fails = "true"
input_joypad_driver = "qnx"
input_autodetect_enable = "true"
video_fullscreen = "true"
video_fullscreen_x = "1024"
video_fullscreen_y = "480"
# Stretch core output across the complete 1024x480 display area.
# ASPECT_RATIO_FULL = 24; integer scaling must stay disabled.
aspect_ratio_index = "24"
video_scale_integer = "false"
# Vendor EGL on the display-manager video layer can block forever waiting for
# a Screen vsync acknowledgement. The QNX context presents at interval 0; RA's
# non-vsync frame limiter keeps the menu/core paced at the configured refresh.
video_vsync = "false"
video_shader_enable = "false"
core_info_cache_enable = "true"
# The active config is the SD copy selected by ra.sh, never this factory file.
config_save_on_exit = "true"

# --- Ozone layout for the 1024x480 ultrawide HU display ---
ozone_show_sidebar = "true"
ozone_collapse_sidebar = "true"
kiosk_mode_enable = "false"
menu_show_confirm = "true"
confirm_quit = "true"
content_show_netplay = "0"
content_show_add_entry = "0"
content_show_contentless_cores = "0"
content_show_explore = "false"
content_show_images = "false"
content_show_music = "false"
content_show_video = "false"
menu_show_information = "false"
menu_show_configurations = "false"
menu_show_help = "false"
menu_show_load_core = "false"
menu_show_load_content = "false"
menu_show_online_updater = "false"
menu_show_core_updater = "false"
menu_timedate_enable = "false"
menu_core_enable = "false"
menu_battery_level_enable = "false"
menu_mouse_enable = "false"

# Offline HU: disable account/network/service features even if a host build
# happens to provide them. Keyboard search and keyboard-to-gamepad stay enabled.
cheevos_enable = "false"
discord_allow = "false"
cloud_sync_enable = "false"
ai_service_enable = "false"
microphone_enable = "false"
network_cmd_enable = "false"
network_remote_enable = "false"
network_on_demand_thumbnails = "false"
bluetooth_enable = "false"
wifi_enabled = "false"
keyboard_gamepad_enable = "true"

# Keep the useful local gameplay tools, but hide unrelated quick-menu actions.
quick_menu_show_take_screenshot = "false"
quick_menu_show_replay = "false"
quick_menu_show_start_recording = "false"
quick_menu_show_start_streaming = "false"
quick_menu_show_set_core_association = "false"
quick_menu_show_reset_core_association = "false"
quick_menu_show_shaders = "false"
quick_menu_show_download_thumbnails = "false"
quick_menu_show_information = "false"
settings_show_recording = "false"
settings_show_file_browser = "false"
settings_show_logging = "false"
settings_show_directory = "false"
settings_show_user = "false"
settings_show_accessibility = "false"
settings_show_ai_service = "false"
settings_show_achievements = "false"
settings_show_network = "false"
settings_show_power_management = "false"
settings_show_configuration = "false"
# OZONE_COLOR_THEME_AUDI_RED (stock MIB2 High palette).
ozone_menu_color_theme = "15"
ozone_font_scale = "1"
ozone_font_scale_factor_global = "1.0"
menu_scale_factor = "1.0"
menu_show_sublabels = "false"

# --- lifecycle: defensive save-state on pause is written natively; auto-load it
#     on next launch so an unclean power-off / timeout resumes exactly. ---
savestate_auto_load = "true"
savestate_auto_save = "false"
sort_savefiles_enable = "true"
sort_savestates_enable = "true"

# --- summon the Ozone menu mid-game from the gamepad (no HU keypad in-game).
#     Combo 2 = L3+R3 (press both analog sticks). ---
input_menu_toggle_gamepad_combo = "2"
menu_swap_ok_cancel_buttons = "false"

# --- logging: BRING-UP = verbose to a file on the SD (read via ssh). Flip
#     log_verbosity to "false" once video/audio are confirmed. ---
log_verbosity = "true"
log_to_file = "true"
log_to_file_timestamp = "true"
frontend_log_level = "1"
libretro_log_level = "1"
