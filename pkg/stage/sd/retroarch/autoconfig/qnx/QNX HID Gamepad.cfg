# Generic USB/Bluetooth HID fallback for the native QNX joypad driver.
#
# The driver exposes controls in HID Usage order (Button 1 == 0) and axes in
# the fixed X/Y/Z/Rx/Ry/Rz/Slider/Dial order. A controller-specific profile
# with input_vendor_id/input_product_id always takes precedence over this
# fallback when one is added to this directory.
input_driver = "qnx"
input_device = "QNX HID Gamepad"
input_device_display_name = "Generic QNX HID Gamepad"

# Face buttons: south, east, west, north.
input_b_btn = "0"
input_a_btn = "1"
input_y_btn = "2"
input_x_btn = "3"

# This order matches the controller already verified on the MHI2Q: triggers
# are HID Buttons 5/6, shoulders 7/8, stick clicks 9/10, select/start 11/12.
input_l2_btn = "4"
input_r2_btn = "5"
input_l_btn = "6"
input_r_btn = "7"
input_l3_btn = "8"
input_r3_btn = "9"
input_select_btn = "10"
input_start_btn = "11"

# Native HID hats are exposed through RetroArch's standard hN directions.
input_up_btn = "h0up"
input_down_btn = "h0down"
input_left_btn = "h0left"
input_right_btn = "h0right"

# X/Y and Rx/Ry. The D-pad also accepts the left stick so controllers without
# a Hat Switch remain usable in the menu.
input_l_x_plus_axis = "+0"
input_l_x_minus_axis = "-0"
input_l_y_plus_axis = "+1"
input_l_y_minus_axis = "-1"
input_r_x_plus_axis = "+3"
input_r_x_minus_axis = "-3"
input_r_y_plus_axis = "+4"
input_r_y_minus_axis = "-4"
input_up_axis = "-1"
input_down_axis = "+1"
input_left_axis = "-0"
input_right_axis = "+0"

# Analog triggers when the HID descriptor publishes Z/Rz in addition to (or
# instead of) trigger buttons.
input_l2_axis = "+2"
input_r2_axis = "+5"
