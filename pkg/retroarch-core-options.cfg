# Factory core-option defaults for the MHI2Q build. ra.sh copies this file to
# the current SD card once; subsequent changes remain local to that card.
# Keep this deliberately minimal: only select the fast, known-good QNX
# backends. All visual/compatibility tuning is left writable in RetroArch.

# Game Boy Advance: prefer a supplied official BIOS and keep the ARM dynarec.
gpsp_bios = "auto"
gpsp_drc = "enabled"
gpsp_frameskip = "disabled"

# PlayStation: prefer a supplied official BIOS and use the ARM/NEON dynarec.
pcsx_rearmed_bios = "auto"
pcsx_rearmed_drc = "enabled"
pcsx_rearmed_frameskip_type = "disabled"

# Nintendo 64: QNX GLES2 renderer, HLE RSP and ARM dynarec at display height.
mupen64plus-cpucore = "dynamic_recompiler"
mupen64plus-rdp-plugin = "gliden64"
mupen64plus-rsp-plugin = "hle"
mupen64plus-aspect = "4:3"
mupen64plus-43screensize = "640x480"
