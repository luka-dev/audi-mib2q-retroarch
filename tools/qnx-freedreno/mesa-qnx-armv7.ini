[binaries]
c = '/opt/qnx650/host/linux/x86/usr/bin/arm-unknown-nto-qnx6.5.0eabi-gcc'
cpp = '/opt/qnx650/host/linux/x86/usr/bin/arm-unknown-nto-qnx6.5.0eabi-g++'
ar = '/opt/qnx650/host/linux/x86/usr/bin/arm-unknown-nto-qnx6.5.0eabi-ar'
strip = '/opt/qnx650/host/linux/x86/usr/bin/arm-unknown-nto-qnx6.5.0eabi-strip'
pkg-config = '/usr/bin/pkg-config'

[host_machine]
system = 'qnx'
cpu_family = 'arm'
cpu = 'armv7-a'
endian = 'little'

[properties]
needs_exe_wrapper = true

[built-in options]
c_args = ['-march=armv7-a', '-mfloat-abi=softfp', '-mfpu=vfpv3-d16', '-fno-omit-frame-pointer', '-DUTIL_ARCH_LITTLE_ENDIAN=1', '-DUTIL_ARCH_BIG_ENDIAN=0']
cpp_args = ['-march=armv7-a', '-mfloat-abi=softfp', '-mfpu=vfpv3-d16', '-fno-omit-frame-pointer', '-DUTIL_ARCH_LITTLE_ENDIAN=1', '-DUTIL_ARCH_BIG_ENDIAN=0']
c_link_args = ['-Wl,--build-id=sha1']
cpp_link_args = ['-Wl,--build-id=sha1']
