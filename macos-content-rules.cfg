# Host equivalent of pkg/content-rules.cfg. Games stay in the deployable SD
# image; the macOS test never duplicates or modifies them.
root0 = "build/sd_card/retroarch"

rule0_directory = "ps1"
rule0_playlist = "Sony - PlayStation"
rule0_extensions = "cue|chd|pbp"
rule0_core = "pcsx_rearmed_libretro"
rule0_core_name = "PCSX-ReARMed"
rule0_recursive = "true"
rule0_label_mode = "keep_disc"

rule1_directory = "gba"
rule1_playlist = "Nintendo - Game Boy Advance"
rule1_extensions = "gba|bin"
rule1_core = "gpsp_libretro"
rule1_core_name = "gpSP"
rule1_recursive = "true"
rule1_label_mode = "keep_disc"
